<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#080b12" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <title>页面不存在｜冯子贤</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        overflow: hidden;
        color: #f4f7fb;
        background:
          radial-gradient(circle at 70% 40%, rgba(77, 168, 255, 0.16), transparent 24rem),
          #080b12;
        place-items: center;
      }

      main {
        width: min(680px, calc(100% - 32px));
        text-align: center;
      }

      .code {
        color: transparent;
        background: linear-gradient(120deg, #8778ff, #4da8ff 55%, #55e7d1);
        background-clip: text;
        font-size: clamp(7rem, 28vw, 13rem);
        font-weight: 800;
        letter-spacing: -0.1em;
        line-height: 0.8;
        -webkit-background-clip: text;
      }

      h1 {
        margin: 36px 0 12px;
        font-size: clamp(1.8rem, 6vw, 3rem);
      }

      p {
        margin: 0;
        color: #8995a8;
      }

      a {
        display: inline-block;
        margin-top: 34px;
        padding: 12px 20px;
        color: #071016;
        background: linear-gradient(120deg, #a99eff, #6fc8ff 58%, #76edd8);
        border-radius: 12px;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #55e7d1;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <h1>这块璞玉还没有被雕刻出来。</h1>
      <p>你访问的页面不存在，回到主页继续看看吧。</p>
      <a href="./">返回主页</a>
    </main>
  </body>
</html>
